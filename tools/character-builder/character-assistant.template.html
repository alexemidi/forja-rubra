<body>
<header class="app-header"><div class="brand"><small>Tormenta20 · Assistente de criação</small><h1>Forja do Herói</h1></div><div class="header-actions"><span class="save-status" id="saveStatus" hidden>Salvo neste navegador</span><button class="button" id="exportButton" type="button" hidden>Exportar ficha</button><button class="button danger" id="resetButton" type="button">Nova ficha</button></div></header>
<div class="shell"><nav class="phase-nav" id="phaseNav"><div class="phase-nav-title">Etapas</div></nav><main class="workspace"><header class="stage-heading"><div><span class="stage-kicker" id="stageKicker"></span><h2 id="stageTitle"></h2><p id="stageDescription"></p></div></header><div class="stage-root" id="stageRoot"></div><footer class="stage-footer"><span class="footer-message" id="footerMessage"></span><div class="footer-actions"><button class="button danger" id="redoInitialItemsButton" type="button" hidden>Refazer escolhas</button><button class="button" id="previousButton" type="button">← Voltar</button><button class="button primary" id="nextButton" type="button">Continuar →</button></div></footer></main></div>

<div class="modal-backdrop school-modal" id="spellSchoolModal" hidden><section class="confirm-modal" role="dialog" aria-modal="true" aria-labelledby="spellSchoolTitle"><header><h3 id="spellSchoolTitle" tabindex="-1">Escolas de magia</h3></header><div class="confirm-modal-body" id="spellSchoolBody"></div><footer id="spellSchoolActions"></footer></section></div>
<div class="modal-backdrop" id="warningModal" hidden><section class="confirm-modal" role="dialog" aria-modal="true" aria-labelledby="warningModalTitle"><header><h3 id="warningModalTitle">Pré-requisitos não atendidos</h3></header><div class="confirm-modal-body" id="warningModalBody"></div><footer><button class="button" id="warningCancel" type="button">Voltar e ajustar</button><button class="button danger" id="warningContinue" type="button">Continuar mesmo assim</button></footer></section></div>
<div class="modal-backdrop" id="officeModal" hidden><section class="confirm-modal" role="dialog" aria-modal="true" aria-labelledby="officeModalTitle"><header><h3 id="officeModalTitle">Escolha o Ofício específico</h3></header><div class="confirm-modal-body"><p class="choice-modal-note">Cada especialização conta como uma perícia diferente. A lista mostra somente Ofícios ainda não treinados.</p><div class="office-grid" id="officeOptions"></div></div><footer><button class="button" id="officeCancel" type="button">Cancelar</button></footer></section></div>
<script>
/*__T20_DATA__*/
const STORAGE_KEY='forja-heroi-t20-v1';
const ATTRS=[['for','Força'],['des','Destreza'],['con','Constituição'],['int','Inteligência'],['sab','Sabedoria'],['car','Carisma']];
const ATTR_LABEL=Object.fromEntries(ATTRS);
const ATTR_COST={[-1]:-1,0:0,1:1,2:2,3:4,4:7};
const SKILLS=[['acrobacia','Acrobacia','des'],['adestramento','Adestramento','car'],['atletismo','Atletismo','for'],['atuacao','Atuação','car'],['cavalgar','Cavalgar','des'],['conhecimento','Conhecimento','int'],['cura','Cura','sab'],['diplomacia','Diplomacia','car'],['enganacao','Enganação','car'],['fortitude','Fortitude','con'],['furtividade','Furtividade','des'],['guerra','Guerra','int'],['iniciativa','Iniciativa','des'],['intimidacao','Intimidação','car'],['intuicao','Intuição','sab'],['investigacao','Investigação','int'],['jogatina','Jogatina','car'],['ladinagem','Ladinagem','des'],['luta','Luta','for'],['misticismo','Misticismo','int'],['nobreza','Nobreza','int'],['oficio','Ofício','int'],['percepcao','Percepção','sab'],['pilotagem','Pilotagem','des'],['pontaria','Pontaria','des'],['reflexos','Reflexos','des'],['religiao','Religião','sab'],['sobrevivencia','Sobrevivência','sab'],['vontade','Vontade','sab']];
const SKILL_LABEL=Object.fromEntries(SKILLS.map(x=>[x[0],x[1]]));
const BOOKS={basico:'Livro Básico',herois_de_arton:'Heróis de Arton',ameacas_de_arton:'Ameaças de Arton',deuses_de_arton:'Deuses de Arton',dragao_brasil:'Dragão Brasil'};
const PHASES=[['Identidade e classe','Personagem, classe inicial e escolhas de classe.'],['Atributos e raça','Compra de atributos, modificadores raciais e habilidades.'],['Origens','Origem única ou padrão + regional.'],['Perícias','Treinos de classe, Inteligência e raça.'],['Divindade','Escolha o poder concedido e confira a divindade correspondente.'],['Poderes','Escolhas raciais, de origem e gerais.'],['Magias','Grimório integrado: magias de classe, raça e poderes.'],['Itens iniciais','Preparação para integração com o Arsenal.'],['Ficha e progressão','Resumo, níveis e multiclasse.']];
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const slug=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'');
const raceById=id=>DATA.races.find(x=>x.id===id);
const classById=id=>DATA.classes.find(x=>x.id===id);
const defaultState=()=>({layoutVersion:4,step:1,completed:[],identity:{characterName:'',playerName:'',raceId:'humano',classId:'arcanista',plannedLevel:1,baseAttrs:{for:0,des:0,con:0,int:0,sab:0,car:0},raceAttrs:[],raceSpecialAttrs:{},raceSubAttrs:{},raceChoices:{},classChoices:{},classRequiredChoices:{},classRequiredOffices:{}},origin:{mode:'single',standard:'',regional:'',benefits:[],officeSpecialties:{},previewBenefit:''},skills:{class:[],int:[],race:[]},powers:{general:[],raceGroups:{},categoryFilter:'all',statusFilter:'all',previewId:'',activeSlot:0},deity:{mode:'none',name:'',power:'',previewPower:'',previewDeity:'',activePowerIndex:0},progression:[],prereqConfirm:{attributes:'',skills:''}});
function loadState(){try{const value=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');if(!value?.identity)return defaultState();if(!value.layoutVersion){value.step=value.step===1?1:Math.min(9,value.step+1);value.completed=(value.completed||[]).map(step=>step===1?1:Math.min(9,step+1));value.layoutVersion=2}return Object.assign(defaultState(),value)}catch{return defaultState()}}
let state=loadState(),saveTimer;
function normalizeState(){const d=defaultState();state.identity=Object.assign(d.identity,state.identity||{});state.identity.baseAttrs=Object.assign(d.identity.baseAttrs,state.identity.baseAttrs||{});['raceAttrs'].forEach(k=>state.identity[k]=Array.isArray(state.identity[k])?state.identity[k]:[]);['raceSpecialAttrs','raceSubAttrs','raceChoices','classChoices','classRequiredChoices'].forEach(k=>state.identity[k]=state.identity[k]&&typeof state.identity[k]==='object'?state.identity[k]:{});state.origin=Object.assign(d.origin,state.origin||{});state.skills=Object.assign(d.skills,state.skills||{});state.powers=Object.assign(d.powers,state.powers||{});state.deity=Object.assign(d.deity,state.deity||{});state.prereqConfirm=Object.assign(d.prereqConfirm,state.prereqConfirm||{});state.completed=Array.isArray(state.completed)?state.completed:[];state.progression=Array.isArray(state.progression)?state.progression:[];state.step=Math.max(1,Math.min(9,Number(state.step)||1))}normalizeState();
function persistNow(){clearTimeout(saveTimer);try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));document.getElementById('saveStatus').textContent='Salvo neste navegador';return true}catch{document.getElementById('saveStatus').textContent='Alterações não salvas';toast('Não foi possível salvar neste navegador. Mantenha esta página aberta e tente novamente.');return false}}
function persist(){clearTimeout(saveTimer);document.getElementById('saveStatus').textContent='Salvando…';saveTimer=setTimeout(persistNow,180)}
window.addEventListener('pagehide',persistNow);
function toast(text){const el=document.getElementById('toast');el.textContent=text;el.classList.add('visible');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('visible'),2800)}
function optionList(def){return def?.opcoes||def?.linhagem||def?.sexo||def?.chassi||def?.fonte||def?.tamanho||[]}
function choiceId(value){return String(value?.id||value?.nome||value||'')}
function choiceName(value){return String(value?.nome||value?.id||value||'')}
function addAttrs(target,source){Object.entries(source||{}).forEach(([id,value])=>target[id]=(target[id]||0)+Number(value||0))}
function allocationCounts(values){return (values||[]).reduce((o,id)=>(o[id]=(o[id]||0)+1,o),{})}
function addAllocation(target,values,value=1){(values||[]).forEach(id=>target[id]=(target[id]||0)+Number(value||1))}
function selectedRaceOption(def){const current=state.identity.raceChoices[def.id];return optionList(def).find(x=>choiceId(x)===current)}
function raceBonuses(){const race=raceById(state.identity.raceId),bonus={for:0,des:0,con:0,int:0,sab:0,car:0};if(!race)return bonus;addAttrs(bonus,race.atributos?.fixos);addAllocation(bonus,state.identity.raceAttrs,race.atributos?.flexiveis?.valor||1);(race.habilidades?.selecionadas||[]).forEach(def=>{if(def.tipo==='atributos_flexiveis')addAllocation(bonus,state.identity.raceSpecialAttrs[def.id],def.valor||1);const opt=selectedRaceOption(def);if(opt){addAttrs(bonus,opt.atributos);addAllocation(bonus,state.identity.raceSubAttrs[def.id],opt.atributosFlexiveis?.valor||1)}});(race.habilidades?.fixas||[]).forEach(h=>{if(!h.escolha)return;const opt=(h.escolha.opcoes||[]).find(x=>choiceId(x)===state.identity.raceChoices[h.id]);if(opt)addAttrs(bonus,opt.atributos)});return bonus}
function finalAttrs(){const bonus=raceBonuses();return Object.fromEntries(ATTRS.map(([id])=>[id,Number(state.identity.baseAttrs[id]||0)+Number(bonus[id]||0)]))}
function pointSpent(){return ATTRS.reduce((sum,[id])=>sum+ATTR_COST[state.identity.baseAttrs[id]],0)}
function bookTag(id){return '<span class="book-tag">'+esc(BOOKS[id]||id||'Sem livro')+'</span>'}
function panel(title,body,note=''){return '<section class="panel"><header class="panel-header"><h3 class="panel-title">'+esc(title)+'</h3>'+(note?'<span class="panel-note">'+esc(note)+'</span>':'')+'</header><div class="panel-body">'+body+'</div></section>'}
function abilityHtml(h){return '<div class="ability"><strong>'+esc(h.nome)+'</strong><p>'+esc(h.descricao||'Descrição ainda não estruturada.')+'</p></div>'}
function renderAllocation(key,config,label){const values=key==='raceAttrs'?state.identity.raceAttrs:(state.identity.raceSpecialAttrs[key]||state.identity.raceSubAttrs[key]||[]);const counts=allocationCounts(values),qty=Number(config?.quantidade||0),allowed=config?.atributosPermitidos||ATTRS.map(x=>x[0]),repeat=Boolean(config?.permitirRepetir);return '<div class="choice-section"><h4>'+esc(label)+' <span class="tag gold">'+values.length+'/'+qty+'</span></h4><div class="allocation">'+allowed.map(id=>'<div class="allocation-item"><span>'+esc(ATTR_LABEL[id]||id)+'</span><div class="allocation-controls"><button type="button" data-action="allocation" data-key="'+esc(key)+'" data-attr="'+id+'" data-dir="-1" '+(!counts[id]?'disabled':'')+'>−</button><output>'+Number(counts[id]||0)+'</output><button type="button" data-action="allocation" data-key="'+esc(key)+'" data-attr="'+id+'" data-dir="1" '+(values.length>=qty||(!repeat&&counts[id])?'disabled':'')+'>+</button></div></div>').join('')+'</div><p>Distribua '+qty+' bônus de '+(config?.valor||1)+(repeat?' (repetições permitidas).':' em atributos diferentes.')+'</p></div>'}
function renderChoice(def,source='race'){const options=optionList(def);if(!options.length)return '';const current=source==='race'?state.identity.raceChoices[def.id]:state.identity.classChoices[def.id];return '<div class="choice-section"><h4>'+esc(def.nome||'Escolha')+'</h4>'+(def.descricao?'<p>'+esc(def.descricao)+'</p>':'')+'<div class="choice-cards">'+options.map(opt=>{const id=choiceId(opt),name=choiceName(opt);return '<label class="choice-card '+(current===id?'selected':'')+'"><input type="radio" name="choice_'+esc(def.id)+'" data-action="'+source+'-choice" data-choice-id="'+esc(def.id)+'" value="'+esc(id)+'" '+(current===id?'checked':'')+'><strong>'+esc(name)+'</strong>'+(opt?.descricao?'<p>'+esc(opt.descricao)+'</p>':'')+'</label>'}).join('')+'</div></div>'}
function requiredRaceChoicesComplete(){const race=raceById(state.identity.raceId);if(!race)return false;const selected=(race.habilidades?.selecionadas||[]).filter(x=>x.obrigatoria&&x.tipo!=='escolha_multipla'&&x.tipo!=='tabu_com_penalidade');for(const def of selected){if(def.tipo==='atributos_flexiveis'){if((state.identity.raceSpecialAttrs[def.id]||[]).length!==Number(def.quantidade||0))return false}else if(!state.identity.raceChoices[def.id])return false;const opt=selectedRaceOption(def);if(opt?.atributosFlexiveis&&(state.identity.raceSubAttrs[def.id]||[]).length!==Number(opt.atributosFlexiveis.quantidade||0))return false}for(const h of race.habilidades?.fixas||[]){if(h.escolha?.obrigatoria&&h.escolha.tipo!=='escolha_multipla'&&!state.identity.raceChoices[h.id])return false}const flex=race.atributos?.flexiveis;if(flex&&state.identity.raceAttrs.length!==Number(flex.quantidade||0))return false;return true}
function mandatoryClassSkills(){const cls=classById(state.identity.classId),result=[];(cls?.caracteristicas?.pericias?.fixas||[]).forEach((entry,index)=>{if(entry.tipo==='escolha'){const chosen=state.identity.classRequiredChoices[index];if(chosen)result.push(chosen)}else if(entry.id)result.push(entry.id)});return [...new Set(result)]}
function classChoiceDescriptors(cls){const out=[];(cls?.habilidades||[]).filter(h=>Number(h.nivel)===1).forEach(h=>{const choices=h.escolhas||[];if(!choices.length)return;const deferred=/magia|escola/i.test(h.nome+' '+JSON.stringify(choices))||/item|equipamento|prot[oó]tipo|esp[oó]lio/i.test(h.nome+' '+JSON.stringify(choices));if(deferred)return;if(choices.some(x=>x.tipo||x.opcoes)){choices.forEach(x=>out.push(Object.assign({id:h.id+'_'+(x.id||slug(x.nome)),descricao:h.descricao},x)))}else out.push({id:h.id,nome:h.nome,descricao:h.descricao,opcoes:choices})});return out}
function parsePowerRequirements(power){const text=power?.preRequisitosTexto||'',attrs=[],skills=[];for(const m of text.matchAll(/\b(For|Des|Con|Int|Sab|Car)\s*([0-9]+)/gi))attrs.push([m[1].toLowerCase(),Number(m[2])]);for(const [id,name] of SKILLS)if(new RegExp('treinad[oa] em '+name,'i').test(text))skills.push(id);const level=Number((text.match(/(\d+)º?\s*nível/i)||[])[1]||2);return{attrs,skills,level,text}}
function classFutureRequirements(){const id=state.identity.classId,result={attrs:[],skills:[]};DATA.classPowers.filter(p=>(p.classeIds||[]).includes(id)).forEach(p=>{const req=parsePowerRequirements(p);req.attrs.forEach(([attr,value])=>result.attrs.push({attr,value,level:req.level,power:p.nome}));req.skills.forEach(skill=>result.skills.push({skill,level:req.level,power:p.nome}))});return result}

// Complementos para escolhas encadeadas e casos raciais especiais.
classChoiceDescriptors=function(cls){
  const descriptors=[];
  (cls?.habilidades||[]).filter(ability=>Number(ability.nivel)===1).forEach(ability=>{
    const choices=ability.escolhas||[];
    if(!choices.length)return;
    // Magias, devoção e equipamentos possuem fases próprias.
    if(/\bmagias?\b|devoto fiel|abençoado/i.test(ability.nome)||/protótipo|espólio|do bom e do melhor/i.test(ability.nome))return;
    if(choices.some(choice=>choice.tipo||choice.opcoes)){
      choices.forEach(choice=>descriptors.push(Object.assign({id:ability.id+'_'+(choice.id||slug(choice.nome)),descricao:ability.descricao},choice)));
    }else{
      descriptors.push({id:ability.id,nome:ability.nome,descricao:ability.descricao,opcoes:choices});
    }
  });
  return descriptors;
};

const baseChoiceName=choiceName;
choiceName=function(value){
  if(value&&typeof value==='object'&&value.nome)return String(value.nome);
  const raw=baseChoiceName(value);
  return raw.replace(/_/g,' ').replace(/\b\w/g,letter=>letter.toUpperCase());
};

const baseRaceBonuses=raceBonuses;
raceBonuses=function(){
  const bonus=baseRaceBonuses();
  if(state.identity.raceId==='golem_desperto'){
    const size=state.identity.raceChoices.golem_desperto_tamanho;
    if(size==='pequeno')bonus.des+=1;
    if(size==='grande')bonus.des-=1;
  }
  return bonus;
};

function selectedOption(def,source='race'){
  const value=source==='class'?state.identity.classChoices[def.id]:state.identity.raceChoices[def.id];
  return optionList(def).find(option=>choiceId(option)===value);
}

function resolvedClassChoice(choice,parentId){
  const resolved=Object.assign({},choice,{id:parentId+'__'+choice.id});
  if(choice.origemDados==='deuses')resolved.opcoes=DATA.deities.map(deity=>({id:slug(deity.nome),nome:deity.nome}));
  return resolved;
}

function renderClassChoiceDetails(def){
  const primary=selectedOption(def,'class');
  if(!primary)return '';
  const secondaryOptions=primary.escolhas_secundarias||[];
  let html='';
  if(secondaryOptions.length){
    const secondaryDef={id:def.id+'__secundaria',nome:'Linhagem',descricao:'Escolha a origem de seus poderes inatos.',opcoes:secondaryOptions};
    html+=baseRenderChoice(secondaryDef,'class');
    const secondary=selectedOption(secondaryDef,'class');
    if(secondary){
      (secondary.escolhas_terciarias||[]).forEach(choice=>{html+=baseRenderChoice(resolvedClassChoice(choice,def.id),'class')});
      if(secondary.estagios?.length){
        html+='<div class="choice-section"><h4>Heranças da linhagem</h4><div class="ability-list">'+secondary.estagios.map(stage=>abilityHtml({nome:stage.nome,descricao:stage.descricao})).join('')+'</div></div>';
      }
    }
  }
  return html;
}

function golemEnergyDetails(def){
  if(def.id!=='golem_desperto_fonte'||state.identity.raceChoices[def.id]!=='Elemental')return '';
  const chassis=state.identity.raceChoices.golem_desperto_chassi;
  let options=[
    {id:'agua',nome:'Água',descricao:'Fonte elemental ligada à água; imunidade ao dano mágico de frio.'},
    {id:'ar',nome:'Ar',descricao:'Fonte elemental ligada ao ar; imunidade ao dano mágico de eletricidade.'},
    {id:'fogo',nome:'Fogo',descricao:'Fonte elemental ligada ao fogo; imunidade ao dano mágico de fogo.'},
    {id:'terra',nome:'Terra',descricao:'Fonte elemental ligada à terra; imunidade ao dano mágico de ácido.'}
  ];
  if(chassis==='golem_desperto_carne')options=options.filter(option=>!['agua','fogo'].includes(option.id));
  if(chassis==='golem_desperto_gelo_eterno')options=options.filter(option=>option.id!=='fogo');
  return baseRenderChoice({id:'golem_fonte_elemento',nome:'Elemento da fonte',descricao:'A escolha do elemento é permanente.',opcoes:options},'race');
}

const baseRenderChoice=renderChoice;
renderChoice=function(def,source='race'){
  const html=baseRenderChoice(def,source);
  if(source==='class')return html+renderClassChoiceDetails(def);
  return html+golemEnergyDetails(def);
};

function additionalChoicesComplete(){
  if(state.identity.raceId==='humano'&&!state.identity.raceChoices.humano_versatil)return false;
  if(state.identity.raceId==='duende'&&!state.identity.raceChoices.duende_tabu)return false;
  for(const def of classChoiceDescriptors(classById(state.identity.classId))){
    const primary=selectedOption(def,'class');
    if(!primary)continue;
    const secondaryOptions=primary.escolhas_secundarias||[];
    if(!secondaryOptions.length)continue;
    const secondaryDef={id:def.id+'__secundaria',opcoes:secondaryOptions};
    const secondary=selectedOption(secondaryDef,'class');
    if(!secondary)return false;
    for(const choice of secondary.escolhas_terciarias||[]){
      if(!state.identity.classChoices[def.id+'__'+choice.id])return false;
    }
  }
  if(state.identity.raceId==='golem_desperto'){
    const source=state.identity.raceChoices.golem_desperto_fonte;
    const chassis=state.identity.raceChoices.golem_desperto_chassi;
    if(source==='Elemental'){
      const element=state.identity.raceChoices.golem_fonte_elemento;
      const forbidden=chassis==='golem_desperto_carne'?['agua','fogo']:chassis==='golem_desperto_gelo_eterno'?['fogo']:[];
      if(!element||forbidden.includes(element))return false;
    }
    if(source==='Vapor'&&['golem_desperto_carne','golem_desperto_gelo_eterno'].includes(chassis))return false;
  }
  return true;
}

const basePhaseIsComplete=phaseIsComplete;
phaseIsComplete=function(step){
  return basePhaseIsComplete(step)&&(step!==1||additionalChoicesComplete());
};

  const nav=document.getElementById('phaseNav');
  nav.innerHTML='<div class="phase-nav-title">Etapas da criação</div>'+PHASES.map((phase,index)=>{

    return '<button class="phase-button '+(number===state.step?'active ':'')+(done?'done':'')+'" data-step="'+number+'"><span class="phase-number">'+number+'</span><span class="phase-label">'+esc(phase[0])+'</span><span class="phase-state">'+(done?'✓':'')+'</span></button>';
  }).join('');
};

// Trata a remoção de poderes raciais antes do manipulador geral.
document.addEventListener('change',event=>{
  if(event.target.dataset.action!=='race-power')return;
  event.stopImmediatePropagation();
  const groupId=event.target.dataset.group;
  const group=racePowerGroups().find(item=>item.id===groupId);
  const selected=state.powers.raceGroups[groupId]||[];
  const id=event.target.value;
  if(event.target.checked){
    if(selected.length>=Number(group?.quantity||0)){
      event.target.checked=false;
      toast('O limite desta escolha já foi alcançado.');
    }else selected.push(id);
  }else{
    state.powers.raceGroups[groupId]=selected.filter(value=>value!==id);
  }
  renderStage();
},true);

parsePowerRequirements=function(power){
  const text=power?.preRequisitosTexto||'',attrs=[],skills=[];
  const attributePatterns={for:'For(?:ça)?',des:'Des(?:treza)?',con:'Con(?:stituição)?',int:'Int(?:eligência)?',sab:'Sab(?:edoria)?',car:'Car(?:isma)?'};
  Object.entries(attributePatterns).forEach(([id,pattern])=>{
    for(const match of text.matchAll(new RegExp('\\b'+pattern+'\\s*([0-9]+)','gi')))attrs.push([id,Number(match[1])]);
  });
  for(const [id,name] of SKILLS){
    if(new RegExp('treinad[oa] em[^.;]*\\b'+name+'\\b','i').test(text))skills.push(id);
  }
  const level=Number((text.match(/(\d+)\s*[º°]?\s*nível/i)||[])[1]||2);
  return{attrs,skills,level,text};
};

function classPowerSourceIds(classId){
  const ids=[classId];
  let parent=DATA.classInheritance?.[classId];
  while(parent&&!ids.includes(parent)){ids.push(parent);parent=DATA.classInheritance?.[parent]}
  return ids;
}

function availableClassPowers(classId){
  const ids=classPowerSourceIds(classId);
  return DATA.classPowers.filter(power=>(power.classeIds||[]).some(id=>ids.includes(id)));
}

classFutureRequirements=function(){
  const result={attrs:[],skills:[]};
  availableClassPowers(state.identity.classId).forEach(power=>{
    const requirement=parsePowerRequirements(power);
    requirement.attrs.forEach(([attr,value])=>result.attrs.push({attr,value,level:requirement.level,power:power.nome}));
    requirement.skills.forEach(skill=>result.skills.push({skill,level:requirement.level,power:power.nome}));
  });
  return result;
};

function classSelectionsComplete(){
  const cls=classById(state.identity.classId);
  const fixed=cls?.caracteristicas?.pericias?.fixas||[];
  if(mandatoryClassSkills().length!==fixed.length)return false;
  for(const def of classChoiceDescriptors(cls)){
    const primary=selectedOption(def,'class');
    if(!primary)return false;
    const secondaryOptions=primary.escolhas_secundarias||[];
    if(!secondaryOptions.length)continue;
    const secondaryDef={id:def.id+'__secundaria',opcoes:secondaryOptions};
    const secondary=selectedOption(secondaryDef,'class');
    if(!secondary)return false;
    for(const choice of secondary.escolhas_terciarias||[]){
      if(!state.identity.classChoices[def.id+'__'+choice.id])return false;
    }
  }
  return true;
}

function raceSelectionsComplete(){
  if(!requiredRaceChoicesComplete())return false;
  if(state.identity.raceId==='humano'&&!state.identity.raceChoices.humano_versatil)return false;
  if(state.identity.raceId==='duende'&&!state.identity.raceChoices.duende_tabu)return false;

function allocationValues(key){
  if(key==='raceAttrs')return state.identity.raceAttrs;
  return state.identity.raceSpecialAttrs[key]||state.identity.raceSubAttrs[key]||[];
}

function raceAllocationSources(){
  const race=raceById(state.identity.raceId),sources=[];
  if(race?.atributos?.flexiveis){
    const config=Object.assign({},race.atributos.flexiveis);
    if(race.id==='kallyanach')config.permitirRepetir=true;
    sources.push({key:'raceAttrs',label:'Raça',config});
  }
  (race?.habilidades?.selecionadas||[]).forEach(def=>{
    if(def.tipo==='atributos_flexiveis')sources.push({key:def.id,label:def.nome||'Habilidade',config:def});
    const option=selectedRaceOption(def);
    const isAnimalNature=race.id==='duende'&&def.id==='duende_natureza'&&choiceId(option)==='animal';
    if(option?.atributosFlexiveis&&!isAnimalNature)sources.push({key:def.id,label:def.nome||choiceName(option),config:option.atributosFlexiveis});
  });
  return sources;
}

function renderRacialCell(attr,bonus,sources){
  const available=sources.filter(source=>(source.config.atributosPermitidos||ATTRS.map(item=>item[0])).includes(attr));
  if(!available.length)return '<div class="matrix-value racial-static">'+(bonus>0?'+':'')+bonus+'</div>';
  const controls=available.map(source=>{
    const values=allocationValues(source.key),counts=allocationCounts(values),quantity=Number(source.config.quantidade||0),repeat=Boolean(source.config.permitirRepetir),count=Number(counts[attr]||0);
    const minusDisabled=!count,plusDisabled=values.length>=quantity||(!repeat&&count);
    const shownValue=available.length===1?bonus:count*Number(source.config.valor||1);
    return '<div class="racial-control-wrap">'+(available.length>1?'<small>'+esc(source.label)+'</small>':'')+'<div class="racial-source" title="'+esc(source.label)+'"><button type="button" data-action="allocation" data-key="'+esc(source.key)+'" data-attr="'+attr+'" data-dir="-1" '+(minusDisabled?'disabled':'')+'>−</button><output>'+(shownValue>0?'+':'')+shownValue+'</output><button type="button" data-action="allocation" data-key="'+esc(source.key)+'" data-attr="'+attr+'" data-dir="1" '+(plusDisabled?'disabled':'')+'>+</button></div></div>';
  }).join('');
  return '<div class="racial-cell">'+(available.length>1?'<div class="racial-total">Total '+(bonus>0?'+':'')+bonus+'</div>':'')+controls+'</div>';
}

function attributeRequirements(attr){
  return classFutureRequirements().attrs.filter(req=>req.attr===attr).filter((req,index,list)=>list.findIndex(other=>other.value===req.value&&other.level===req.level&&other.power===req.power)===index).sort((a,b)=>a.level-b.level||a.value-b.value);
}

function attributeTooltip(attr,requirements){

  return 'Pré-requisito de poderes futuros: '+details+(requirements.length>8?'; e outros.':'.');
}

function applyCompletedChoiceAppearance(){
  if(typeof document.querySelectorAll!=='function')return;
  const fadeUnchecked=(selector,limit)=>{
    const inputs=[...document.querySelectorAll(selector)],selected=inputs.filter(input=>input.checked).length;
    if(selected<Number(limit||0))return;
    inputs.filter(input=>!input.checked&&!input.disabled).forEach(input=>{input.disabled=true;input.closest('label')?.classList.add('choice-exhausted')});
  };
  fadeUnchecked('[data-action="origin-benefit"]',2);
  racePowerGroups().forEach(group=>fadeUnchecked('[data-action="race-power"][data-group="'+CSS.escape(group.id)+'"]',group.quantity));
  const radioGroups=new Map();
  document.querySelectorAll('input[type="radio"]').forEach(input=>{
    const key=input.dataset.action+':'+(input.dataset.choiceId||input.dataset.field||input.name||'default');
    if(!radioGroups.has(key))radioGroups.set(key,[]);
    radioGroups.get(key).push(input);
  });
  radioGroups.forEach(inputs=>{if(inputs.some(input=>input.checked))inputs.filter(input=>!input.checked).forEach(input=>input.closest('label')?.classList.add('choice-alternative'))});
  if(state.deity.name)document.querySelectorAll('.deity-card').forEach(card=>card.classList.toggle('choice-alternative',!card.classList.contains('selected')));
}

function locateMissingChoice(selector,smooth=true){

  target.scrollIntoView({behavior:smooth?'smooth':'auto',block:'center'});
  target.classList.remove('validation-target');
  void target.offsetWidth;

parsePowerRequirements=function(power){
  const text=power?.preRequisitosTexto||'',attrs=[],skills=[],skillGroups=[];
  const attributePatterns={for:'For(?:ça)?',des:'Des(?:treza)?',con:'Con(?:stituição)?',int:'Int(?:eligência)?',sab:'Sab(?:edoria)?',car:'Car(?:isma)?'};
  Object.entries(attributePatterns).forEach(([id,pattern])=>{for(const match of text.matchAll(new RegExp('\\b'+pattern+'\\s*([+-]?[0-9]+)','gi')))attrs.push([id,Number(match[1])])});
  for(const match of text.matchAll(/treinad[oa]\s+em\s+([^.;]+)/gi)){
    const clause=match[1],normalized=slug(clause),found=[];
    const officeMatch=clause.match(/of[ií]cio\s*\(([^)]+)\)/i);
    if(officeMatch){const officeId=normalizeOfficeId(officeMatch[1]);if(OFFICE_LABEL[officeId])found.push(officeToken(officeId))}
    for(const [id,name] of SKILLS){if(id!=='oficio'&&new RegExp('\\b'+name+'\\b','i').test(clause))found.push(id)}
    if(/of[ií]cio/i.test(clause)&&!found.some(value=>skillBaseId(value)==='oficio'))found.push('oficio');
    const unique=[...new Set(found)];
    if(/\s+ou\s+/i.test(clause)&&unique.length>1)skillGroups.push(unique);else unique.forEach(value=>skillGroups.push([value]));
    skills.push(...unique);
  }
  const level=Number((text.match(/(\d+)\s*[º°]?\s*nível/i)||[])[1]||2);
  return{attrs:[...new Map(attrs.map(item=>[item.join(':'),item])).values()],skills:[...new Set(skills)],skillGroups,level,text};
};

let officePending=null;
function openOfficeModal(pending){
  officePending=pending;
  const available=OFFICES.filter(([id])=>!skillRequirementMet(officeToken(id)));
  document.getElementById('officeOptions').innerHTML=available.length?available.map(([id,label])=>'<button class="office-option" type="button" data-action="office-select" data-office="'+id+'">'+esc(label)+'</button>').join(''):'<div class="empty">Todos os Ofícios disponíveis já foram treinados.</div>';
  document.getElementById('officeModal').hidden=false;
}
function closeOfficeModal(){document.getElementById('officeModal').hidden=true;officePending=null}
function applyOfficeChoice(id){
  if(!officePending)return;
  const token=officeToken(id),pending=officePending;
  if(pending.source==='skill'){
    const list=state.skills[pending.group]||[],limits=skillChoiceLimits();
    if(list.length>=limits[pending.group]){toast('Todos os espaços deste grupo já foram preenchidos.');closeOfficeModal();return}
    list.push(token);state.skills[pending.group]=list;
    if(pending.group==='class'){state.skills.race=[];state.skills.int=[]}else if(pending.group==='race')state.skills.int=[];
  }else if(pending.source==='class-required'){
    state.identity.classRequiredChoices[pending.index]='oficio';state.identity.classRequiredOffices[pending.index]=token;state.skills={class:[],race:[],int:[]};
  }else if(pending.source==='origin-benefit'){
    if(state.origin.benefits.length>=2){toast('Você pode escolher apenas dois benefícios.');closeOfficeModal();return}
    state.origin.benefits.push(pending.optionId);state.origin.officeSpecialties[pending.optionId]=token;
  }
  closeOfficeModal();renderStage();
}
function skillChoiceLimits(){
  const cls=classById(state.identity.classId),duplicate=mandatoryClassSkills().filter(id=>[...originSkillIds(),...regionalSkillIds()].includes(id)).length;
  return{class:Number(cls?.caracteristicas?.pericias?.escolhas?.quantidade||0)+duplicate,int:Math.max(0,finalAttrs().int),race:raceSkillSlots()};
}

const POWER_CATEGORY_ORDER=['combate','destino','magia','concedido','tormenta','raca','grupo'];
const POWER_CATEGORY_LABEL={combate:'Poderes de Combate',destino:'Poderes de Destino',magia:'Poderes de Magia',concedido:'Poderes Concedidos',tormenta:'Poderes da Tormenta',raca:'Poderes de Raça',grupo:'Poderes de Grupo'};
function powerById(id){return DATA.generalPowers.find(power=>power.id===id)}
function chosenDeity(){return DATA.deities.find(deity=>deity.nome===state.deity.name)}
function selectedGeneralPowers(exceptId=''){return (state.powers.general||[]).filter(id=>id&&id!==exceptId).map(powerById).filter(Boolean)}
function raceAbilityText(){
  const race=raceById(state.identity.raceId),parts=[];
  (race?.habilidades?.fixas||[]).forEach(ability=>parts.push(ability.nome,ability.descricao));
  (race?.habilidades?.selecionadas||[]).forEach(def=>{parts.push(def.nome,def.descricao);const option=selectedRaceOption(def);if(option)parts.push(choiceName(option),option.descricao)});

function classAbilityText(){const cls=classById(state.identity.classId);return (cls?.habilidades||[]).filter(ability=>Number(ability.nivel||1)<=Number(state.identity.plannedLevel||1)).flatMap(ability=>[ability.nome,ability.descricao]).filter(Boolean).join(' ')}
function ownedPowerNames(exceptId=''){
  const names=[...originPowerNames(),...selectedGeneralPowers(exceptId).map(power=>power.nome),...String(state.deity.power||'').split('|').filter(Boolean)];
  const cls=classById(state.identity.classId),race=raceById(state.identity.raceId);
  (cls?.habilidades||[]).filter(ability=>Number(ability.nivel||1)<=Number(state.identity.plannedLevel||1)).forEach(ability=>names.push(ability.nome));

  racePowerGroups().forEach(group=>(state.powers.raceGroups[group.id]||[]).forEach(id=>{const option=group.options.find(item=>choiceId(item)===id);if(option)names.push(choiceName(option))}));
  return new Set(names.filter(Boolean).map(slug));

function addReason(reasons,text){if(text&&!reasons.includes(text))reasons.push(text)}
function requiredOtherPowerCount(text,category){
  const normalized=slug(text),words={um:1,uma:1,dois:2,duas:2,tres:3,quatro:4};
  const match=normalized.match(/(um|uma|dois|duas|tres|quatro|outro)\s+outros?\s+poderes?\s+d[ao]\s+(tormenta|grupo)/)||normalized.match(/(um|uma|dois|duas|tres|quatro|outro)\s+poder\s+d[ao]\s+(tormenta|grupo)/);
  if(!match||match[2]!==category)return 0;
  return match[1]==='outro'?1:(words[match[1]]||0);
}
function magicCircleAvailable(){if(!/\bmagias?\b/i.test(classAbilityText()))return 0;return Math.min(5,1+Math.floor((Math.max(1,Number(state.identity.plannedLevel))-1)/4))}
function generalPowerEligibility(power){
  const reasons=[],requirements=String(power.preRequisitosTexto||'').trim(),normalized=slug(requirements),attrs=finalAttrs(),trained=allTrainedSkills(),race=raceById(state.identity.raceId),cls=classById(state.identity.classId),deity=chosenDeity(),owned=ownedPowerNames(power.id);
  if(power.categoria==='concedido'&&(!deity||!(deity.poderes_concedidos||[]).some(name=>slug(name)===slug(power.nome))))addReason(reasons,'O poder não é concedido pela divindade escolhida.');
  if(power.categoria==='raca'){
    const source=String(power.racasTexto||''),allowed=source.split(',').map(slug).filter(Boolean);
    if(source&&slug(source)!=='varias'&&!allowed.includes(slug(race?.nome)))addReason(reasons,'Disponível para: '+source+'.');
  }
  const attrPattern=/\b(For(?:ça)?|Des(?:treza)?|Con(?:stituição)?|Int(?:eligência)?|Sab(?:edoria)?|Car(?:isma)?)\s*([+-]?\d+)(\s+ou\s+menor)?/gi;
  for(const match of requirements.matchAll(attrPattern)){
    const id=slug(match[1]).slice(0,3),attrId={for:'for',des:'des',con:'con',int:'int',sab:'sab',car:'car'}[id],value=Number(match[2]),valid=match[3]?attrs[attrId]<=value:attrs[attrId]>=value;
    if(!valid)addReason(reasons,ATTR_LABEL[attrId]+' '+value+(match[3]?' ou menor':'')+'.');
  }
  const level=Number((requirements.match(/(\d+)\s*[º°]?\s*nível/i)||[])[1]||0);
  if(level&&Number(state.identity.plannedLevel)<level)addReason(reasons,'Requer nível '+level+' de personagem.');
  const parsed=parsePowerRequirements(power);
  (parsed.skillGroups||[]).forEach(group=>{if(!group.some(skillRequirementMet))addReason(reasons,'Treinamento em '+group.map(skillDisplayName).join(' ou ')+'.')});
  if(/treinado na perícia escolhida/i.test(requirements)&&!trained.length)addReason(reasons,'Requer treinamento na perícia escolhida.');
  const circle=Number((requirements.match(/magias?\s+de\s+(\d+)[º°]?\s+círculo/i)||[])[1]||0);
  if(circle&&magicCircleAvailable()<circle)addReason(reasons,'Requer lançar magias de '+circle+'º círculo.');
  if(/habilidade de classe Magias|\blançar magias\b/i.test(requirements)&&!magicCircleAvailable())addReason(reasons,'Requer a habilidade de classe Magias.');
  if(/lançar magias divinas/i.test(requirements)&&!['clerigo','frade','druida','ermitao','paladino','santo','usurpador'].includes(cls?.id))addReason(reasons,'Requer lançar magias divinas.');
  const proficiencies=cls?.caracteristicas?.proficiencias||[];
  if(/proficiência com armaduras pesadas/i.test(requirements)&&!proficiencies.includes('armaduras_pesadas'))addReason(reasons,'Requer proficiência com armaduras pesadas.');
  if(/proficiência com escudos/i.test(requirements)&&!proficiencies.includes('escudos'))addReason(reasons,'Requer proficiência com escudos.');
  if(/proficiência com a arma/i.test(requirements)&&!proficiencies.some(item=>/^armas_/.test(item)))addReason(reasons,'Requer proficiência com a arma escolhida.');
  const raceText=raceAbilityText(),classText=classAbilityText();
  if(/arma natural fornecida/i.test(requirements)&&!/arma natural|mordida|chifres|garras|cauda/i.test(raceText))addReason(reasons,'Requer uma arma natural fornecida pela raça.');
  if(/possuir asas/i.test(requirements)&&!/asas|voo|voar/i.test(raceText))addReason(reasons,'Requer asas.');
  if(/possuir um familiar/i.test(requirements)&&!/familiar/i.test(raceText+' '+classText))addReason(reasons,'Requer possuir um familiar.');
  if(/sensibilidade a luz/i.test(requirements)&&!/sensibilidade a luz/i.test(raceText))addReason(reasons,'Requer Sensibilidade a Luz racial.');
  if(/não humano/i.test(requirements)&&state.identity.raceId==='humano')addReason(reasons,'Requer uma raça não humana.');
  if(/devoto de uma divindade que canalize energia positiva/i.test(requirements)&&(!deity||!['positiva','qualquer'].includes(slug(deity.canalizar_energia))))addReason(reasons,'Requer devoção a uma divindade que canalize energia positiva.');
  for(const category of ['tormenta','grupo']){
    const required=requiredOtherPowerCount(requirements,category),amount=selectedGeneralPowers(power.id).filter(item=>item.categoria===category).length;
    if(required&&amount<required)addReason(reasons,'Requer '+required+' outro(s) '+POWER_CATEGORY_LABEL[category].toLowerCase()+'.');
  }
  const candidates=DATA.generalPowers.filter(candidate=>candidate.id!==power.id&&normalized.includes(slug(candidate.nome))).sort((a,b)=>b.nome.length-a.nome.length);
  const unique=[];candidates.forEach(candidate=>{if(!unique.some(other=>slug(other.nome).includes(slug(candidate.nome))))unique.push(candidate)});
  if(unique.length){
    const hasOr=/\bou\b/i.test(requirements);
    if(hasOr){if(!unique.some(candidate=>owned.has(slug(candidate.nome))))addReason(reasons,'Requer um destes poderes: '+unique.map(candidate=>candidate.nome).join(' ou ')+'.')}
    else unique.forEach(candidate=>{if(!owned.has(slug(candidate.nome)))addReason(reasons,'Requer '+candidate.nome+'.')});
  }
  return{ok:reasons.length===0,reasons};
}

// Divindade escolhida a partir do poder concedido, conforme o fluxo da planilha.

  const cls=classById(state.identity.classId),race=raceById(state.identity.raceId),races=deity?.devotos?.racas||[],classes=deity?.devotos?.classes||[];
  if(['clerigo','frade'].includes(cls?.id))return true;
  return races.some(name=>['todas','todos'].includes(slug(name))||slug(name)===slug(race?.nome))||classes.some(name=>['todas','todos'].includes(slug(name))||slug(name)===slug(cls?.nome));

function grantedPowerData(name){
  // As duas fontes locais usam grafias diferentes para o mesmo poder de Thwor.
  const aliases={tropas_duyshidakk:'trocas_duyshidakk'},normalized=slug(name);
  return DATA.generalPowers.find(power=>power.categoria==='concedido'&&slug(power.nome)===normalized)||DATA.generalPowers.find(power=>power.categoria==='concedido'&&slug(power.nome)===aliases[normalized]);

function deityPowerValues(){return String(state.deity.power||'').split('|').slice(0,deityPowerCount())}
function setDeityPower(index,value){const values=deityPowerValues();while(values.length<deityPowerCount())values.push('');values[index]=value;state.deity.power=values.join('|')}
function allGrantedPowerNames(){return [...new Set(DATA.deities.flatMap(deity=>deity.poderes_concedidos||[]))].sort((a,b)=>a.localeCompare(b,'pt-BR'))}
function grantedPowerPairs(deity=null){
  return (deity?[deity]:DATA.deities).flatMap(god=>(god.poderes_concedidos||[]).map(powerName=>({deity:god,powerName,data:grantedPowerData(powerName)}))).sort((a,b)=>a.powerName.localeCompare(b.powerName,'pt-BR')||a.deity.nome.localeCompare(b.deity.nome,'pt-BR'));
}
function deitySelectionStatus(deityName,powerName){
  const deity=DATA.deities.find(item=>item.nome===deityName),index=Number(state.deity.activePowerIndex||0);
  if(!deity||(deity.poderes_concedidos||[]).every(name=>slug(name)!==slug(powerName)))return{valid:false,message:'Este poder não pertence à divindade.'};
  if(!Number.isInteger(index)||index<0||index>=deityPowerCount())return{valid:false,message:'Escolha um espaço válido para o poder.'};
  const values=state.deity.name===deityName?deityPowerValues():[];
  if(values.some((name,i)=>i!==index&&name&&slug(name)===slug(powerName)))return{valid:false,message:'Este poder já foi escolhido em outro espaço.'};
  return{valid:true,selected:slug(values[index]||'')===slug(powerName)};
}
function renderDeityPowerDetail(powerName,deityName){
  const deity=DATA.deities.find(item=>item.nome===deityName);if(!powerName||!deity)return '<aside class="power-detail-panel"><div class="empty">Selecione um poder concedido à esquerda para conferir a divindade, suas obrigações e demais informações.</div></aside>';
  const data=grantedPowerData(powerName),accepts=deityAccepts(deity),isThwor=slug(deity.nome)==='thwor',selection=deitySelectionStatus(deityName,powerName),warning='Esse deus não te aceita como devoto, mas se você rezar muito insistindo (e com a permissão do mestre)... Talvez ele te aceite.';
  const buttonText=!selection.valid?selection.message:selection.selected?'Poder selecionado neste espaço':accepts?'Escolher este poder e divindade':'Escolher com permissão do mestre';
  return '<aside class="power-detail-panel deity-detail" id="deityDetail" tabindex="-1"><div class="tag-row"><span class="tag gold">'+esc(powerName)+'</span>'+(data?bookTag(data.livroOrigemId):'')+'</div><div class="deity-god-option '+(accepts?'':'restricted')+'"><h4>'+esc(deity.nome)+'</h4><div class="tag-row"><span class="tag '+(accepts?'green':'red')+'">'+(accepts?'Aceita este personagem':'Devoção restrita')+'</span><span class="tag">Energia '+esc(deity.canalizar_energia||'—')+'</span></div><p><strong>Símbolo sagrado:</strong> '+esc(deity.simbolo_sagrado||'—')+'</p><p><strong>Arma preferida:</strong> '+esc(deity.arma_preferida||'—')+'</p><p><strong>Devotos:</strong> '+esc([...(deity.devotos?.racas||[]),...(deity.devotos?.classes||[])].join(', ')||'—')+'</p><p><strong>Obrigações e restrições:</strong> '+esc(deity.obrigacoes_restricoes||'—')+'</p>'+(!accepts?'<div class="warning-box red"><strong>'+esc(warning)+'</strong></div>':'')+(isThwor?'<div class="info-box blue devotion-reminder"><strong>Lembrete de Thwor:</strong> para esta devoção, considere o personagem um aliado dos duyshidakk e observe essa exigência nas obrigações acima.</div>':'')+'<button type="button" class="button '+(accepts?'primary':'danger')+'" data-action="deity-confirm-preview" data-deity="'+esc(deity.nome)+'" data-power="'+esc(powerName)+'" '+(!selection.valid||selection.selected?'disabled':'')+'>'+esc(buttonText)+'</button></div></aside>';
}
let deitySearchQuery='';
renderDeity=function(){
  const rule=devotionRule(),count=deityPowerCount();
  if(rule.forced==='none'){state.deity.mode='none';state.deity.name='';state.deity.power='';return panel('Inimigo dos Deuses','<div class="warning-box red"><strong>Não devoto obrigatório.</strong> '+esc(rule.text)+'</div>')}
  const mode=panel('Tipo de devoção','<div class="info-box blue">'+esc(rule.text)+'</div><div class="choice-cards" style="margin-top:10px">'+(!rule.forced?'<label class="choice-card '+(state.deity.mode==='none'?'selected':'')+'"><input type="radio" data-field="deityMode" value="none" '+(state.deity.mode==='none'?'checked':'')+'><strong>Não devoto</strong><p>Sem poder concedido e sem obrigações religiosas.</p></label>':'')+'<label class="choice-card '+(state.deity.mode==='pantheon'?'selected':'')+'"><input type="radio" data-field="deityMode" value="pantheon" '+(state.deity.mode==='pantheon'?'checked':'')+'><strong>Panteão</strong><p>Culto ao conjunto dos deuses, conforme as regras da classe.</p></label><label class="choice-card '+(state.deity.mode==='devout'?'selected':'')+'"><input type="radio" data-field="deityMode" value="devout" '+(state.deity.mode==='devout'?'checked':'')+'><strong>Divindade</strong><p>Comece escolhendo um poder concedido; as divindades relacionadas aparecerão ao lado.</p></label></div>');
  if(state.deity.mode!=='devout')return mode;
  const values=deityPowerValues(),deity=chosenDeity(),pairs=grantedPowerPairs(deity);let preview=pairs.find(pair=>slug(pair.powerName)===slug(state.deity.previewPower)&&pair.deity.nome===state.deity.previewDeity);
  if(!preview&&deity&&values.find(Boolean))preview=pairs.find(pair=>slug(pair.powerName)===slug(values.find(Boolean)));
  if(!preview)preview=pairs[0];state.deity.previewPower=preview?.powerName||'';state.deity.previewDeity=preview?.deity.nome||'';
  const slotbar='<div class="deity-slotbar">'+Array.from({length:count},(_,index)=>'<button type="button" class="filter-chip '+(state.deity.activePowerIndex===index?'active':'')+'" data-action="deity-power-slot" data-index="'+index+'">'+(values[index]?esc((index+1)+' · '+values[index]):esc((index+1)+' · Escolher poder'))+'</button>').join('')+'</div>';
  const current=deity?'<div class="info-box blue" style="margin-bottom:10px"><strong>Divindade atual: '+esc(deity.nome)+'</strong><div class="inline-actions" style="margin-top:8px"><button type="button" class="button danger" data-action="deity-reset">Trocar divindade</button>'+(values[state.deity.activePowerIndex]?'<button type="button" class="button" data-action="deity-power-remove" data-index="'+state.deity.activePowerIndex+'">Remover poder deste espaço</button>':'')+'</div></div>':'';
  const cards=pairs.map(pair=>{
    const active=slug(pair.powerName)===slug(state.deity.previewPower)&&pair.deity.nome===state.deity.previewDeity;
    const chosen=pair.deity.nome===state.deity.name&&values.some(name=>slug(name)===slug(pair.powerName));
    return '<button type="button" class="deity-power-row '+(active?'selected ':'')+(chosen?'chosen':'')+'" aria-pressed="'+active+'" aria-controls="deityDetail" data-action="deity-power-preview" data-power="'+esc(pair.powerName)+'" data-deity="'+esc(pair.deity.nome)+'" data-search="'+esc(slug(pair.powerName+' '+pair.deity.nome))+'"><span class="deity-power-heading"><strong>'+esc(pair.powerName)+'</strong><em>'+esc(pair.deity.nome)+'</em></span><small>'+esc(pair.data?.descricao||'Descrição ainda não localizada no catálogo de poderes concedidos.')+'</small></button>';
  }).join('');
  const list='<div><input class="input search" id="deityPowerSearch" aria-label="Pesquisar poder ou divindade" placeholder="Pesquisar poder ou divindade…" value="'+esc(deitySearchQuery)+'"><div class="deity-power-list">'+cards+'</div><p id="deitySearchEmpty" class="empty" hidden>Nenhum poder corresponde à pesquisa.</p></div>';
  return mode+panel('Escolha pelo poder concedido',current+slotbar+'<div class="deity-choice-layout">'+list+renderDeityPowerDetail(state.deity.previewPower,state.deity.previewDeity)+'</div>','Selecionados: '+values.filter(Boolean).length+'/'+count);
};

function bindPowerSearch(){const input=document.getElementById('generalPowerSearch');if(input)input.addEventListener('input',()=>{const query=slug(input.value);document.querySelectorAll('.power-row').forEach(row=>row.classList.toggle('hidden',query&&!row.dataset.search.includes(query)))})}
function bindDeityPowerSearch(){
  const input=document.getElementById('deityPowerSearch');if(!input)return;
  const filter=()=>{const query=slug(input.value);deitySearchQuery=input.value;let visible=0;document.querySelectorAll('.deity-power-row').forEach(row=>{const matches=!query||row.dataset.search.includes(query);row.classList.toggle('hidden',!matches);if(matches)visible++});document.getElementById('deitySearchEmpty').hidden=visible>0};
  input.addEventListener('input',filter);filter();
}
function renderDeitySelection({showDetails=false,resetSearch=false}={}){
  const list=document.querySelector('.deity-power-list'),scrollTop=list?.scrollTop||0;
  if(resetSearch)deitySearchQuery='';
  renderStage();const updatedList=document.querySelector('.deity-power-list');if(updatedList)updatedList.scrollTop=resetSearch?0:scrollTop;
  if(showDetails&&window.matchMedia?.('(max-width: 860px)').matches){const detail=document.getElementById('deityDetail');detail?.scrollIntoView({behavior:'smooth',block:'start'});detail?.focus({preventScroll:true})}
}
function commitDeityPower(deityName,powerName){
  const selection=deitySelectionStatus(deityName,powerName);
  if(!selection.valid){toast(selection.message);return false}
  if(selection.selected)return true;
  if(state.deity.name&&state.deity.name!==deityName)state.deity.power='';
  state.deity.name=deityName;setDeityPower(Number(state.deity.activePowerIndex||0),powerName);
  const values=deityPowerValues(),next=values.findIndex(value=>!value);if(next>=0)state.deity.activePowerIndex=next;
  state.deity.previewPower=powerName;state.deity.previewDeity=deityName;renderDeitySelection();return true;
}

const baseResetDownstreamV3=resetDownstream;
resetDownstream=function(kind){
  baseResetDownstreamV3(kind);
  if(kind==='race'||kind==='class'){state.deity={mode:'none',name:'',power:'',previewPower:'',previewDeity:'',activePowerIndex:0};state.powers.general=[];state.powers.previewId='';state.powers.activeSlot=0}
  if(kind==='race'){state.skills.race=[];state.skills.int=[]}
  if(kind==='class')state.identity.classRequiredOffices={};
};

powerMissingChoices=function(){
  const missing=[];
  racePowerGroups().forEach(group=>{const amount=(state.powers.raceGroups[group.id]||[]).length;if(amount!==Number(group.quantity||0))missing.push({title:group.name,message:'Escolha '+(Number(group.quantity||0)-amount)+' poder(es) que ainda faltam em '+group.name+'.',selector:'[data-action="race-power"][data-group="'+group.id+'"]'})});
  const generalMissing=generalPowerSlots()-state.powers.general.filter(Boolean).length;
  if(generalMissing>0){
    const preview=powerById(state.powers.previewId),pending=state.powers.previewPending&&preview&&!state.powers.general.includes(preview.id)&&generalPowerEligibility(preview).ok;
    missing.push(pending?{title:'Confirmar poder',message:'Você selecionou '+preview.nome+', mas ainda não confirmou. Clique em Confirmar abaixo da descrição para preencher este espaço.',selector:'[data-action="power-select"][data-power-id="'+preview.id+'"]'}:{title:'Poder geral',message:'Selecione e confirme '+generalMissing+' poder(es) geral(is) que ainda faltam.',selector:'[data-action="power-slot"]'});
  }
  return missing;
};
deityMissingChoices=function(){
  const missing=[],rule=devotionRule();if(rule.forced==='none')return missing;
  if(rule.forced==='devout'&&state.deity.mode==='none')missing.push({title:'Devoção obrigatória',message:'Esta classe exige devoção. Escolha o Panteão ou uma divindade.',selector:'[data-field="deityMode"]'});
  if(state.deity.mode==='devout'&&!state.deity.name)missing.push({title:'Poder e divindade',message:'Escolha primeiro um poder concedido e depois uma das divindades apresentadas.',selector:'.deity-choice-layout'});
  if(state.deity.mode==='devout'&&state.deity.name){
    const values=deityPowerValues().filter(Boolean),required=deityPowerCount(),deity=chosenDeity();
    if(values.length!==required)missing.push({title:'Poder concedido',message:'Escolha '+(required-values.length)+' poder(es) concedido(s) que ainda faltam.',selector:'[data-action="deity-power-slot"]'});
    if(new Set(values.map(slug)).size!==values.length)missing.push({title:'Poder repetido',message:'Escolha poderes concedidos diferentes para cada espaço.',selector:'[data-action="deity-power-slot"]'});
    if(!deity||values.some(name=>!(deity.poderes_concedidos||[]).some(power=>slug(power)===slug(name))))missing.push({title:'Poder e divindade',message:'Escolha poderes concedidos pela divindade atual.',selector:'.deity-choice-layout'});
  }
  return missing;
};
missingChoices=function(step){if(step===1)return classMissingChoices();if(step===2)return raceMissingChoices();if(step===3)return skillMissingChoices();if(step===4)return originMissingChoices();if(step===5)return deityMissingChoices();if(step===6)return powerMissingChoices();return[]};
phaseIsComplete=function(step){
  if(step===1)return Boolean(state.identity.characterName.trim()&&state.identity.playerName.trim()&&state.identity.classId&&Number(state.identity.plannedLevel)>=1&&classSelectionsComplete());
  if(step===2)return pointSpent()===10&&raceSelectionsComplete();
  if(step===4){if(state.identity.raceId==='golem_desperto')return true;return Boolean(state.origin.standard&&state.origin.benefits.length===2&&(state.origin.mode==='single'||state.origin.regional))}
  if(step===3){const limits=skillChoiceLimits();return ['class','int','race'].every(group=>(state.skills[group]||[]).length===limits[group])}
  if(step===5){const rule=devotionRule();if(rule.forced==='none')return true;if(rule.forced==='devout'&&state.deity.mode==='none')return false;if(state.deity.mode==='devout'){const deity=chosenDeity(),values=deityPowerValues().filter(Boolean);return Boolean(deity&&values.length===deityPowerCount()&&new Set(values.map(slug)).size===values.length&&values.every(name=>(deity.poderes_concedidos||[]).some(power=>slug(power)===slug(name))))}return true}
  if(step===6)return racePowerGroups().every(group=>(state.powers.raceGroups[group.id]||[]).length===Number(group.quantity||0))&&state.powers.general.filter(Boolean).length===generalPowerSlots();
  return true;
};
validationMessage=function(step,short=false){if(phaseIsComplete(step))return short?'Etapa pronta para continuar.':'Etapa completa.';const messages={1:'Preencha os nomes e conclua as escolhas obrigatórias da classe.',2:'Gaste exatamente os 10 pontos e conclua as escolhas obrigatórias da raça.',3:'Escolha a origem, exatamente dois benefícios e, se necessário, uma origem regional.',4:'Complete todas as quantidades de perícias sem repetir treinos.',5:'Defina a devoção a partir de um poder concedido.',6:'Complete as escolhas de poderes raciais e gerais.'};return messages[step]||'Revise as informações desta etapa.'};

showPrerequisiteWarning=function(kind,items){
  const isAttribute=kind==='attributes',first=items[0],target=isAttribute?'[data-attribute-id="'+first.id+'"]':'[data-action="skill"][value="'+first.id+'"], [data-skill-base="'+skillBaseId(first.id)+'"]';
  locateMissingChoice(target,false);document.getElementById('warningModalTitle').textContent=isAttribute?'Atributos abaixo de pré-requisitos futuros':'Perícias exigidas por poderes futuros';
  document.getElementById('warningModalBody').innerHTML='<p>Você pode continuar normalmente, mas não poderá escolher os poderes relacionados enquanto não cumprir os requisitos abaixo.</p><div class="confirm-list">'+items.map(item=>'<div class="confirm-item"><strong>'+(isAttribute?esc(ATTR_LABEL[item.id])+' '+item.value:esc(skillDisplayName(item.id)))+' · a partir do nível '+item.level+'</strong><span>'+esc(item.powers.join(' · '))+'</span></div>').join('')+'</div><p>Deseja continuar mesmo assim?</p>';
  document.getElementById('warningCancel').textContent='Voltar e ajustar';document.getElementById('warningContinue').hidden=false;const modal=document.getElementById('warningModal');modal.dataset.mode='prerequisite';modal.dataset.kind=kind;modal.dataset.target=target;modal.dataset.signature=prerequisiteSignature(items);modal.hidden=false;
};

renderStage=function(){
  const [title,description]=PHASES[state.step-1],renders=[renderIdentityClass,renderAttributesRace,renderSkillsSplit,renderOrigins,renderDeity,renderPowers,renderSpells,()=>renderDeferred('items'),renderSummary];
  document.getElementById('stageKicker').textContent='Fase '+state.step+' de 9';document.getElementById('stageTitle').textContent=title;document.getElementById('stageDescription').textContent=description;document.getElementById('stageRoot').innerHTML=renders[state.step-1]();document.getElementById('previousButton').disabled=state.step===1;document.getElementById('nextButton').textContent=state.step===9?'Ficha concluída':'Continuar →';document.getElementById('footerMessage').textContent=validationMessage(state.step,true);renderNav();applyCompletedChoiceAppearance();if(state.step===5)bindDeityPowerSearch();if(state.step===6)bindPowerSearch();if(state.step===7)mountGrimoire();persist();
};

document.addEventListener('click',event=>{
  const button=event.target.closest?.('[data-action]');if(!button)return;const action=button.dataset.action;
  if(action==='origin-benefit-button'){
    const option=originBenefitOptions(selectedStandardOrigin()).find(item=>item.id===button.dataset.optionId);if(!option)return;state.origin.previewBenefit=option.id;
    if(button.dataset.disabled==='true'){toast('Esta perícia já está treinada. Escolha outro benefício.');renderStage();return}
    const selected=state.origin.benefits.includes(option.id);
    if(selected){state.origin.benefits=state.origin.benefits.filter(id=>id!==option.id);delete state.origin.officeSpecialties[option.id]}
    else if(state.origin.benefits.length>=2){toast('Você já escolheu os dois benefícios. Remova um deles para trocar.')}
    else if(option.type==='skill'&&skillTokenFromName(option.name)==='oficio'){openOfficeModal({source:'origin-benefit',optionId:option.id});return}
    else state.origin.benefits.push(option.id);
    state.completed=state.completed.filter(step=>step<4);renderStage();return;
  }
  if(action==='skill-jump'){document.getElementById(button.dataset.target)?.scrollIntoView({behavior:'smooth',block:'start'});return}
  if(action==='power-preview'){state.powers.previewId=button.dataset.powerId;state.powers.previewPending=true;renderStage();revealPowerDetail();return}
  if(action==='power-filter-category'){state.powers.categoryFilter=button.dataset.value;renderStage();return}
  if(action==='power-filter-status'){state.powers.statusFilter=button.dataset.value;renderStage();return}
  if(action==='power-slot'){state.powers.activeSlot=Number(button.dataset.index);state.powers.previewId=state.powers.general[state.powers.activeSlot]||state.powers.previewId;renderStage();return}
  if(action==='power-select'){const index=Number(state.powers.activeSlot||0),id=button.dataset.powerId,verdict=generalPowerEligibility(powerById(id));if(!verdict.ok){toast('Este poder ainda possui pré-requisitos pendentes.');return}if(state.powers.general.some((value,i)=>value===id&&i!==index)){toast('Este poder já foi escolhido em outro espaço.');return}state.powers.general[index]=id;const next=Array.from({length:generalPowerSlots()},(_,i)=>i).find(i=>!state.powers.general[i]);if(next!==undefined)state.powers.activeSlot=next;renderStage();return}
  if(action==='power-remove'){state.powers.general[Number(button.dataset.index)]='';renderStage();return}
  if(action==='deity-power-preview'){state.deity.previewPower=button.dataset.power;state.deity.previewDeity=button.dataset.deity;renderDeitySelection({showDetails:true});return}
  if(action==='deity-power-slot'){state.deity.activePowerIndex=Number(button.dataset.index);const value=deityPowerValues()[state.deity.activePowerIndex];if(value){state.deity.previewPower=value;state.deity.previewDeity=state.deity.name}renderDeitySelection();return}
  if(action==='deity-power-remove'){setDeityPower(Number(button.dataset.index),'');renderDeitySelection();return}
  if(action==='deity-reset'){state.deity.name='';state.deity.power='';state.deity.previewPower='';state.deity.previewDeity='';state.deity.activePowerIndex=0;state.powers.general=[];renderDeitySelection({resetSearch:true});return}
  if(action==='deity-confirm-preview'){commitDeityPower(button.dataset.deity,button.dataset.power);return}
});
document.addEventListener('change',event=>{if(event.target.dataset.field==='standardOrigin')state.origin.previewBenefit='';if(event.target.dataset.action==='race-choice'){state.skills.race=[];state.skills.int=[]}if(event.target.dataset.field==='class-required')state.skills={class:[],race:[],int:[]};if(event.target.dataset.action==='skill'&&event.target.dataset.group==='class'){state.skills.race=[];state.skills.int=[]}else if(event.target.dataset.action==='skill'&&event.target.dataset.group==='race')state.skills.int=[]},true);
/*__T20_SPELL_INTEGRATION__*/
renderStage();
</script>
