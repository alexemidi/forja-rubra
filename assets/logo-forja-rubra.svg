<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" width="320" height="64">
  <defs>
    <radialGradient id="logoBgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#700d17" />
      <stop offset="100%" stop-color="#090708" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="logoRubro" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea3948" />
      <stop offset="50%" stop-color="#c51f2c" />
      <stop offset="100%" stop-color="#8a111b" />
    </linearGradient>
    <linearGradient id="logoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcedaa" />
      <stop offset="50%" stop-color="#e9ad59" />
      <stop offset="100%" stop-color="#b87b28" />
    </linearGradient>
    <filter id="forgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Brasão / Símbolo da Forja (Esquerda) -->
  <g transform="translate(6, 2)">
    <!-- Aura de Calor -->
    <circle cx="30" cy="30" r="28" fill="url(#logoBgGlow)" opacity="0.6" />
    <!-- Borda Hexagonal Fina -->
    <polygon points="30,4 54,16 54,44 30,56 6,44 6,16" fill="#110d0f" stroke="#4a252a" stroke-width="1.5" />
    <polygon points="30,8 49,18 49,42 30,52 11,42 11,18" fill="none" stroke="url(#logoGold)" stroke-width="0.75" stroke-opacity="0.5" />

    <!-- Bigorna Rubra e Fagulha -->
    <path d="M17 26 L43 26 L41 31 L35 33 L35 40 L39 44 L21 44 L25 40 L25 33 L19 31 Z" fill="url(#logoRubro)" stroke="#4a252a" stroke-width="1" />
    <path d="M28 14 L32 14 L31 23 L29 23 Z" fill="url(#logoGold)" />
    <polygon points="30,10 32,14 28,14" fill="#ffffff" filter="url(#forgeGlow)" />
  </g>

  <!-- Tipografia FORJA RUBRA -->
  <text x="76" y="34" font-family="'Tormenta', 'Cinzel', serif" font-size="25" font-weight="bold" fill="url(#logoGold)" letter-spacing="2" filter="url(#forgeGlow)">FORJA RUBRA</text>
  
  <!-- Subtítulo Canônico Tormenta 20 -->
  <text x="78" y="49" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#c9b2aa" letter-spacing="3.5" text-transform="uppercase">TORMENTA 20 · CANÔNICO</text>
  
  <!-- Detalhe de Linha Rubra divisória -->
  <line x1="77" y1="39" x2="280" y2="39" stroke="#4a252a" stroke-width="1" />
  <circle cx="280" cy="39" r="1.5" fill="#e9ad59" />
</svg>
